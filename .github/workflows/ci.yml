name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, migrations, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      # These credentials belong only to the disposable CI database.
      SECRET_KEY: ci-only-signing-key-not-for-deployment-0123456789abcdef
      DEBUG: "False"
      DJANGO_SETTINGS_MODULE: config.test_settings
      DATABASE_URL: postgresql://studio_ci:studio_ci_password@127.0.0.1:5432/studio_ci
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: studio_ci
          POSTGRES_USER: studio_ci
          POSTGRES_PASSWORD: studio_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio_ci -d studio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Check types
        run: uv run --frozen mypy

      - name: Check for missing migrations
        run: uv run --frozen python manage.py makemigrations --check --dry-run

      - name: Run PostgreSQL tests
        run: uv run --frozen python manage.py test --settings=config.test_settings --noinput
